<text x="722" y="305" font-size="12" fill="#7a3f08">1 provision  建机/等 Running</text>
<text x="722" y="332" font-size="12" fill="#7a3f08">2 setup  挂载/禁 Manager/软链</text>
<text x="722" y="359" font-size="12" fill="#7a3f08">3 ready  等 8188 + 资产可见</text>
<text x="722" y="386" font-size="12" fill="#7a3f08">4 submit  渲染 + /prompt</text>
<text x="722" y="413" font-size="12" fill="#7a3f08">5 wait  /history 轮询</text>
<text x="722" y="440" font-size="12" fill="#7a3f08">6 fetch  scp 产物</text>
<text x="722" y="467" font-size="12" fill="#7a3f08">7 verify  7 项复验</text>
<text x="722" y="494" font-size="12" fill="#7a3f08">8 persist  manifest 原子写</text>
<text x="722" y="521" font-size="12" fill="#7a3f08">9 release  销毁/回池</text>
<text x="30" y="940" font-size="11.5" fill="#5a6577">说明：ComfyUI 没有公网端口，宿主机通过 sshpass 在实例内执行 python/urllib 调 127.0.0.1:8188；产物用 scp 从 /root/ComfyUI/output/ 拉回。</text>
<text x="30" y="960" font-size="11.5" fill="#5a6577">P2.0 新增：registry/*.json → registry.db → render_job() → run.py；scheduler/queue/state 零改动。</text>
